
<form action="#" method="post">
    <fieldset>
        <legend>Tus datos</legend>
        <p>
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" required minlength="3">
        </p>
        <p>
            <label for="correos">Correo electrónico</label>
            <input type="email" id="correos" name="correo" required>
        </p>
        <p>
            <label for="telefono">Celular (10 dígitos)</label>
            <input type="tel" id="telefono" name="telefono" pattern="[0-9]{10}"
                   title="Escribe 10 números, sin espacios">
        </p>
    </fieldset>

    <fieldset>
        <legend>Tu mensaje</legend>
        <p>
            <label for="motivo">Motivo</label>
            <select id="motivo" name="motivo" required>
                <option value="">Selecciona una opción</option>
                <option value="reserva">Reserva</option>
                <option value="pedido">Pedido para empresas</option>
            </select>
        </p>
        <p>
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="4" minlength="10" required></textarea>
        </p>
    </fieldset>

    <p><button type="submit">Enviar mensaje</button></p>
</form>
